name: sysadm

# Only caddy publishes a port. opencode runs as a child process of sysadm, so there is no separate container.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${SYSADM_HTTPS_PORT:-443}:443"
    environment:
      SYSADM_DOMAIN: ${SYSADM_DOMAIN:-localhost}
      SYSADM_TLS: ${SYSADM_TLS:-internal}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [public]

  sysadm:
    build:
      context: .
      dockerfile: docker/sysadm.Dockerfile
    restart: unless-stopped
    # .env holds SYSADM_MASTER_KEY, so it goes only to this service.
    env_file: .env
    # WireGuard plugin creates wg interfaces; the host needs the wireguard kernel module (Linux >= 5.6 has it).
    cap_add: [NET_ADMIN]
    environment:
      DB_PATH: /data/sysadm.sqlite
      INFRA_DIR: /infra
    volumes:
      - sysadm-data:/data
      - infra:/infra
    networks: [public, egress]

volumes:
  sysadm-data:
  infra:
  caddy-data:

networks:
  public: {}
  egress: {}
