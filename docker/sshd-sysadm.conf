# sshd for the built-in "localhost" node: the station manages its own container. Not published outside.
ListenAddress 127.0.0.1
HostKey /data/ssh/host/ssh_host_ed25519_key
AllowUsers localadm
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AllowTcpForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
